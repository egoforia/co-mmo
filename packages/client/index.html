<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>co-MMO</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud" hidden>
      <span id="hud-name"></span>
      <span id="hud-online"></span>
      <a id="gods-view-link" href="/gods-view.html" target="_blank" hidden>God's View</a>
      <button id="sound-button" type="button" aria-expanded="false">Sound</button>
      <button id="invite-button" type="button">Invite a friend</button>
      <button id="account-button" type="button">Account</button>
    </div>

    <div id="stats" hidden>
      <div class="bar hp"><span id="hp-fill"></span><b id="hp-text"></b></div>
      <div class="bar energy"><span id="energy-fill"></span><b id="energy-text"></b></div>
      <div class="bar xp"><span id="xp-fill"></span><b id="xp-text"></b></div>
      <div id="stats-line"></div>
    </div>
    <ol id="quests" hidden></ol>
    <div id="keys" hidden>
      <span><kbd>Space</kbd> strike</span><span><kbd>E</kbd> talk</span>
      <button type="button" data-open="inventory"><kbd>I</kbd> bag</button>
      <button type="button" data-open="crafting"><kbd>C</kbd> craft</button>
      <button type="button" data-open="bible"><kbd>B</kbd> Bible</button>
      <button type="button" data-open="prayer" class="pray"><kbd>G</kbd> Pray</button>
    </div>
    <div id="abilities" hidden></div>
    <div id="dialogue" hidden></div>
    <div id="crafting" class="window" hidden></div>
    <div id="shop" class="window" hidden></div>
    <div id="trade" class="window" hidden></div>
    <div id="trade-request" hidden></div>
    <div id="inventory" class="window" hidden></div>
    <div id="bible" hidden></div>
    <div id="prayer" class="window" hidden></div>
    <div id="account" class="window" hidden></div>
    <div id="away" class="window" hidden></div>
    <form id="party" autocomplete="off" hidden></form>
    <div id="party-invite" hidden></div>

    <div id="chat" hidden>
      <ol id="chat-log" aria-live="polite"></ol>
      <form id="chat-form" autocomplete="off">
        <select id="chat-channel" aria-label="Channel">
          <option value="say">Say</option>
          <option value="region">Region</option>
          <option value="party">Party</option>
          <option value="whisper">Whisper</option>
          <option value="world">World</option>
        </select>
        <input id="chat-input" maxlength="280" placeholder="Press Enter to talk" />
      </form>
    </div>

    <form id="sound-panel" hidden>
      <label>Effects <input name="effects" type="range" min="0" max="1" step="0.05" /></label>
      <label>Music <input name="music" type="range" min="0" max="1" step="0.05" /></label>
    </form>

    <div id="panel" class="panel" hidden></div>
    <div id="toast" role="status" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
