# The Owner can ask the coding agent for changes on a wish's pull request by
# writing @claude in a comment or review; it answers and pushes to the branch.
name: Claude on pull requests

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        id: claude
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,Bash(npm test),Bash(npm run typecheck),Bash(npx vitest run:*),Bash(node scripts/wish-guard.mjs:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "Follow CLAUDE.md. Never change files under .github/, never merge, and never push to main."

      # Counts this run in the game's budget: on a wish's pull request (branch
      # wish/<issue>), the real cost goes to the wish's issue, which the game reads.
      - name: Tell the game what it cost
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          branch=$(gh pr view "$PR" --json headRefName --jq .headRefName 2>/dev/null || true)
          case "$branch" in wish/*) issue=${branch#wish/} ;; *) exit 0 ;; esac
          cost=$(jq -c --arg run "$RUN_URL" '[.[]? | select(.type == "result")] | last | (.total_cost_usd // .cost_usd) | numbers | {run:$run,usd:.,kind:"followup"}' "$EXECUTION_FILE" 2>/dev/null || true)
          [ -n "$cost" ] || exit 0
          gh issue comment "$issue" --body "The coding agent worked on pull request #$PR again ([run]($RUN_URL)).

          <!-- co-mmo-cost $cost -->"
