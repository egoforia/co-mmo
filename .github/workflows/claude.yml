# The Owner can ask the coding agent for changes on a wish's pull request by
# writing @claude in a comment or review; it answers and pushes to the branch.
name: Claude on pull requests

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: >-
      (github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,LS,Bash(npm test),Bash(npm run typecheck),Bash(npx vitest run:*),Bash(node scripts/wish-guard.mjs:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
            --append-system-prompt "Follow CLAUDE.md. Never change files under .github/, never merge, and never push to main."
