# The robot playtester (docs/playtest.md) on the pull requests the Owner picks:
# put the "playtest" label on a pull request and bots and a browser play the
# real game with fake AI, so nothing is paid for. It runs again on every push
# while the label stays. Screenshots are kept with the run.
name: Playtest

on:
  pull_request:
    types: [labeled, opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: playtest-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  playtest:
    # Another label being added is no reason to play again.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'playtest') &&
      (github.event.action != 'labeled' || github.event.label.name == 'playtest')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run playtest -- --reporter=default --reporter=github-actions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playtest-screenshots
          path: playtest-results/
          if-no-files-found: ignore
